name: Napi tartalom

on:
  schedule:
    # 23:05 UTC = éjfél után Budapesten: horoszkóp + retro + az első friss cikkek
    - cron: "5 23 * * *"
    # Napközben kétóránként új hírek keresése (nyáron 6:20–22:20, télen 5:20–21:20 budapesti idő)
    - cron: "20 4-20/2 * * *"
  workflow_dispatch: {}   # kézi indítás a GitHub felületről

concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tartalom generálása
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5-5
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RETRO_AUTO_PUBLISH: "true"
          MAX_ARTICLES_PER_RUN: "4"
          DAILY_ARTICLE_LIMIT: "40"
        run: python kollektiva_content.py
      - name: Commit és push (a Cloudflare Pages erre automatikusan újratelepít)
        run: |
          git config user.name "kollektiva-bot"
          git config user.email "bot@kollektiva.hu"
          git add public/
          git diff --cached --quiet && exit 0
          git commit -m "Tartalom: $(TZ=Europe/Budapest date '+%F %H:%M')"
          git pull --rebase origin main
          git push
