name: Napi tartalom

on:
  schedule:
    # 23:05 UTC = éjfél után Budapesten (télen 00:05, nyáron 01:05)
    - cron: "5 23 * * *"
  workflow_dispatch: {}   # kézi indítás a GitHub felületről

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tartalom generálása
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5-5
        run: python kollektiva_content.py
      - name: Commit és push (a Cloudflare Pages erre automatikusan újratelepít)
        run: |
          git config user.name "kollektiva-bot"
          git config user.email "bot@kollektiva.hu"
          git add public/data/*.json
          git diff --cached --quiet || git commit -m "Napi tartalom: $(TZ=Europe/Budapest date +%F)"
          git push
